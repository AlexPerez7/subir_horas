name: CI

# Chequeo en cada push/PR: sintaxis Python válida (py_compile, no
# importa nada asi que no necesita ninguno de los secrets/env vars
# obligatorias de backend/config.py), sintaxis JS válida (node
# --check), y los tests de tests/ (funciones puras de backend/horas.py
# - fechas y validaciones, sin hablar con Odoo ni Supabase; ver
# conftest.py en la raíz para las env vars dummy que necesita
# backend/config.py para poder importarse). Atrapa errores tontos y de
# lógica antes de que lleguen a la VM via el deploy automático.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sintaxis-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar todos los .py (chequeo de sintaxis)
        run: |
          find backend scripts -name "*.py" -print0 | xargs -0 python -m py_compile
          python -m py_compile backend_odoo.py

  sintaxis-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chequear sintaxis de js/app.js
        run: node --check js/app.js

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (incluye pytest)
        run: pip install -q -r requirements-dev.txt
      - name: Correr tests
        run: python -m pytest -q
