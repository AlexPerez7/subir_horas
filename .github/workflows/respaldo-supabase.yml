name: Respaldo semanal de Supabase

# Exporta las tablas auditoria y telegram_links (vía la API REST de
# Supabase) y las sube como artifact de GitHub Actions - red de
# seguridad extra además de los backups propios de Supabase (retención
# limitada en el free tier). No reemplaza point-in-time recovery real,
# pero cubre el escenario "se rompió/vació la base por error" con algo
# restaurable a mano.
#
# La tabla `usuarios` (contiene password_hash) queda deliberadamente
# afuera: este repo es público, y los artifacts de Actions en un repo
# público son descargables por cualquiera - no vale la pena exponer
# hashes de contraseña, aunque estén hasheados. Para respaldarla, usar
# el comando manual documentado en el README ("Recuperación ante
# desastres"), que corre en tu máquina local y no sube nada a ningún
# lado.
#
# Requiere los secrets SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY
# cargados en Settings → Secrets and variables → Actions (los mismos
# valores del .env de la VM).

on:
  schedule:
    - cron: "0 6 * * 1"  # lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Exportar tablas desde Supabase
        run: |
          for TABLA in auditoria telegram_links; do
            curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/$TABLA?select=*" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -o "$TABLA.json"
          done

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-supabase-${{ github.run_id }}
          path: |
            auditoria.json
            telegram_links.json
          retention-days: 90
