name: Mantener despierto el backend de Koyeb

# Koyeb (plan free) escala el servicio a cero tras ~1h sin trafico, y el
# primer pedido despues de eso tarda unos segundos en responder mientras
# levanta de nuevo la instancia. Este job le hace un ping liviano cada 45
# minutos durante horario laboral aproximado (para no gastar de mas los
# minutos gratis de Actions en un repo privado) para que nunca llegue a
# escalar a cero mientras lo usas.
#
# Horario: 11:00-23:59 UTC, lunes a viernes. Ajustalo si no coincide
# con tu horario real - Chile anda en UTC-3 o UTC-4 segun horario de
# verano, así que este rango cubre aprox. 7am-8pm / 8am-9pm hora local.
# Muy por debajo de los 2000 minutos/mes gratis que da GitHub en repos
# privados.

on:
  schedule:
    - cron: "*/45 11-23 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al backend
        run: curl -fsS --max-time 60 https://subir-horas.onrender.com/
